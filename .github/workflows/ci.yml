name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test runtimes and installed NuGet package
        shell: pwsh
        run: |
          if ($IsWindows) {
            ./eng/verify.ps1 -Frameworks net8.0,net9.0,net10.0,net462 -Legacy
          } else {
            ./eng/verify.ps1 -Frameworks net8.0,net9.0,net10.0
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            TestResults/*.trx
            artifacts/*.nupkg
