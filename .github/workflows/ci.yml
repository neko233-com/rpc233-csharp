name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Rpc233.csproj -c Release
      - run: dotnet run --project Tests/Rpc233.Tests.csproj -c Release
      - run: dotnet pack Rpc233.csproj -c Release --no-build -o artifacts
